name: Temporary WordPress redesign runner

on:
  workflow_dispatch:
    inputs:
      operation:
        description: WordPress operation
        required: true
        default: inspect
        type: choice
        options:
          - inspect
          - apply
          - rollback
  push:
    branches:
      - ops/wp-redesign-runner

permissions:
  contents: read

jobs:
  redesign:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WP_USER: ${{ secrets.MONAMIE_WP_USER }}
      WP_PASS: ${{ secrets.MONAMIE_WP_PASS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Run WordPress operation
        run: python ops/wp_monamie_chicken_redesign.py "${{ inputs.operation }}"
